name: Supabase Keepalive

# Supabase ucretsiz planda trafiksiz projeler otomatik duraklatiliyor (bir kere, sadece okuma
# sorgusuyla bunu engelleyemedik). Bu is 6 gunde bir gercek bir INSERT + DELETE yapiyor —
# yazma islemi, okumadan daha guvenilir "aktiflik" sayiliyor. Eklenen test satiri hemen siliniyor.
# status='__keepalive__' disindaki satirlari anon key ASLA silemez (bkz. RLS policy).
# CRM entegrasyonu devreye girince bu workflow kaldirilabilir.

on:
  schedule:
    - cron: "0 8 */6 * *" # ~6 gunde bir, 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Test satiri ekle ve hemen sil
        run: |
          set -e
          URL="https://auqnxvlzqbkdbzuetsyx.supabase.co/rest/v1/leads"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          ID=$(curl -sf -X POST "$URL" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"full_name":"Keepalive Test","status":"__keepalive__","notes":"otomatik, hemen silinir"}' \
            | jq -r '.[0].id')

          echo "Eklenen test satiri: $ID"

          curl -sf -X DELETE "$URL?id=eq.$ID&status=eq.__keepalive__" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

          echo "Silindi."
